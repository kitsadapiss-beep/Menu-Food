<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บเมนูอาหาร - Food Menu Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f8fafc;
        }
        .eaten-card {
            opacity: 0.75;
            filter: grayscale(20%);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

    <!-- Header Section -->
    <header class="bg-emerald-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white p-2.5 rounded-full text-emerald-600 shadow">
                    <i class="fa-solid fa-utensils text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold leading-tight">Food Check-in</h1>
                    <p class="text-xs text-emerald-100">เช็ครายการอาหารที่กินไปแล้ววันนี้</p>
                </div>
            </div>
            <!-- Reset Button -->
            <button onclick="resetAll()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-medium px-4 py-2 rounded-xl transition shadow flex items-center gap-2">
                <i class="fa-solid fa-rotate-left"></i>
                <span>รีเซ็ตการบันทึก</span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-6 sm:px-6">

        <!-- Progress Bar Card -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 mb-6">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-semibold text-slate-600">ความคืบหน้าการกินวันนี้</span>
                <span id="progress-text" class="text-sm font-bold text-emerald-600">0 / 0 (0%)</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-3.5 overflow-hidden">
                <div id="progress-bar" class="bg-emerald-500 h-3.5 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>
        </div>

        <!-- Filter and Search Section -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
            <!-- Category Tabs -->
            <div class="flex flex-wrap gap-2 w-full md:w-auto">
                <button onclick="filterCategory('all')" class="cat-btn active bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm" data-cat="all">ทั้งหมด</button>
                <button onclick="filterCategory('main')" class="cat-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-xl text-sm font-medium transition" data-cat="main">อาหารจานหลัก</button>
                <button onclick="filterCategory('dessert')" class="cat-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-xl text-sm font-medium transition" data-cat="dessert">ของหวาน</button>
                <button onclick="filterCategory('drink')" class="cat-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-xl text-sm font-medium transition" data-cat="drink">เครื่องดื่ม</button>
            </div>

            <!-- Status Filter & Search Input -->
            <div class="flex gap-2 w-full md:w-auto">
                <div class="relative flex-grow">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" oninput="renderMenu()" placeholder="ค้นหาชื่ออาหาร..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <select id="status-filter" onchange="renderMenu()" class="bg-white border border-slate-200 text-slate-600 rounded-xl text-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="all">สถานะทั้งหมด</option>
                    <option value="uneaten">ยังไม่ได้กิน</option>
                    <option value="eaten">กินแล้ว</option>
                </select>
            </div>
        </div>

        <!-- Food Menu Grid -->
        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Loading Indicator -->
            <div id="loading-state" class="col-span-full text-center py-12">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-emerald-600 mb-2"></i>
                <p class="text-slate-500 text-sm">กำลังโหลดข้อมูลจาก Google Sheets...</p>
            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12 bg-white rounded-2xl border border-dashed border-slate-200 mt-4">
            <i class="fa-solid fa-bowl-food text-4xl text-slate-300 mb-3"></i>
            <p class="text-slate-500 font-medium">ไม่พบรายการอาหารที่ค้นหา</p>
        </div>

    </main>

    <!-- Custom Dialog Modal for Reset Confirmation -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-xl">
            <div class="w-12 h-12 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">ล้างข้อมูลการกิน?</h3>
            <p class="text-sm text-slate-500 mb-6">คุณต้องการยกเลิกสถานะ "กินแล้ว" ของทุกรายการหรือไม่?</p>
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-2.5 border border-slate-200 text-slate-600 rounded-xl font-medium text-sm hover:bg-slate-50">ยกเลิก</button>
                <button onclick="confirmReset()" class="flex-1 py-2.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl font-medium text-sm shadow-sm">ยืนยัน</button>
            </div>
        </div>
    </div>

    <script>
        // กำหนด URL ของ Google Apps Script Web App
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwsQRm5cNRX7JfiwU4rTay6_U_rq1PZ2WKCifwntcdrgNv76wNO6CV-HzFjGITdtgihyg/exec";

        let foods = [];
        let currentCategory = 'all';

        window.onload = function() {
            fetchFoods();
        };

        // ดึงข้อมูลจาก Google Sheets
        async function fetchFoods() {
            try {
                const response = await fetch(SCRIPT_URL);
                foods = await response.json();
                renderMenu();
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('menu-grid').innerHTML = `
                    <div class="col-span-full text-center py-8 text-rose-500">
                        เกิดข้อผิดพลาดในการโหลดข้อมูล กรุณาตรวจสอบการเชื่อมต่อ
                    </div>`;
            }
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            const emptyState = document.getElementById('empty-state');
            const searchKeyword = document.getElementById('search-input').value.toLowerCase().trim();
            const statusFilter = document.getElementById('status-filter').value;

            const filtered = foods.filter(item => {
                const matchCategory = (currentCategory === 'all' || item.category === currentCategory);
                const matchSearch = item.name.toLowerCase().includes(searchKeyword);
                
                let matchStatus = true;
                if (statusFilter === 'eaten') matchStatus = item.eaten;
                if (statusFilter === 'uneaten') matchStatus = !item.eaten;

                return matchCategory && matchSearch && matchStatus;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                grid.innerHTML = filtered.map(item => `
                    <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm hover:shadow-md transition-all flex items-center justify-between gap-4 ${item.eaten ? 'eaten-card bg-slate-50 border-emerald-200' : ''}">
                        
                        <div class="flex items-center gap-3.5 min-w-0">
                            <div class="relative flex-shrink-0">
                                <img src="${item.image}" alt="${item.name}" 
                                     onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=150&q=80';" 
                                     class="w-16 h-16 rounded-xl object-cover">
                                ${item.eaten ? `
                                    <div class="absolute -top-1.5 -right-1.5 bg-emerald-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow-sm">
                                        <i class="fa-solid fa-check"></i>
                                    </div>
                                ` : ''}
                            </div>
                            
                            <div class="truncate">
                                <div class="flex items-center gap-2">
                                    <h3 class="font-semibold text-slate-800 text-base truncate ${item.eaten ? 'line-through text-slate-500' : ''}">${item.name}</h3>
                                </div>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-xs px-2 py-0.5 rounded-md font-medium ${getCategoryBadge(item.category)}">
                                        ${getCategoryName(item.category)}
                                    </span>
                                    <span class="text-xs text-slate-400"><i class="fa-solid fa-fire text-amber-500 mr-1"></i>${item.calories} แคล</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex-shrink-0">
                            <button onclick="toggleEaten(${item.id})" 
                                class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center gap-1.5 ${
                                    item.eaten 
                                    ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200 border border-emerald-300' 
                                    : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm hover:shadow'
                                }">
                                <i class="fa-solid ${item.eaten ? 'fa-circle-check text-emerald-600' : 'fa-plus'}"></i>
                                <span>${item.eaten ? 'กินแล้ว' : 'กดว่ากินแล้ว'}</span>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            updateProgress();
        }

        // อัปเดตสถานะที่หน้าเว็บและส่งค่าไปบันทึกบน Google Sheets
        async function toggleEaten(id) {
            foods = foods.map(item => item.id === id ? { ...item, eaten: !item.eaten } : item);
            renderMenu();

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'toggle', id: id })
                });
            } catch (err) {
                console.error("Error updating eaten status:", err);
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = btn.dataset.cat === cat 
                    ? "cat-btn active bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm"
                    : "cat-btn bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-2 rounded-xl text-sm font-medium transition";
            });
            renderMenu();
        }

        function updateProgress() {
            const total = foods.length;
            const eatenCount = foods.filter(f => f.eaten).length;
            const percentage = total > 0 ? Math.round((eatenCount / total) * 100) : 0;

            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${eatenCount} / ${total} รายการ (${percentage}%)`;
        }

        function resetAll() {
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
        }

        async function confirmReset() {
            foods = foods.map(item => ({ ...item, eaten: false }));
            renderMenu();
            closeModal();

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'reset' })
                });
            } catch (err) {
                console.error("Error resetting data:", err);
            }
        }

        function getCategoryName(cat) {
            switch (cat) {
                case 'main': return 'อาหารจานหลัก';
                case 'dessert': return 'ของหวาน';
                case 'drink': return 'เครื่องดื่ม';
                default: return 'ทั่วไป';
            }
        }

        function getCategoryBadge(cat) {
            switch (cat) {
                case 'main': return 'bg-amber-50 text-amber-700 border border-amber-200';
                case 'dessert': return 'bg-pink-50 text-pink-700 border border-pink-200';
                case 'drink': return 'bg-sky-50 text-sky-700 border border-sky-200';
                default: return 'bg-slate-100 text-slate-600';
            }
        }
    </script>
</body>
</html>
